apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-web
  namespace: 6-day
  annotations:
    kubernetes.io/change-cause: "6-day: add toleration for dedicated=edge"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-web
  template:
    metadata:
      labels:
        app: edge-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          env:
            - name: ROLLOUT_TEST
              value: "taint-test"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "edge"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: zone
                    operator: In
                    values:
                      - edge
