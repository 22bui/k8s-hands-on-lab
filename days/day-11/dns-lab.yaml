apiVersion: v1
kind: Namespace
metadata:
  name: 11-day
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: 11-day
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: 11-day
spec:
  selector: {app: api}
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: 11-day
  annotations:
    tag: "add replicas"
spec:
  replicas: 2
  selector:
    matchLabels: {app: client}
  template:
    metadata:
      labels: {app: client}
    spec:
      containers:
      - name: client
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c"]
        args:
        - |
          while true; do
            if wget -qO- -T 2 http://api >/dev/null 2>&1; then echo "$(date +%T) OK"; else echo "$(date +%T) FAIL"; fi
            sleep 3
          done

