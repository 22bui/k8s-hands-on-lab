apiVersion: v1
kind: Pod
metadata:
  name: dns-pin
  namespace: 11-day
spec:
  containers:
    - name: dns-pin
      image: busybox:1.36
      command:
        - sleep
        - "3600"
  dnsPolicy: None
  dnsConfig:
    nameservers: 
      - 10.96.0.10
    searches: 
      - 11-day.svc.cluster.local 
      - svc.cluster.local
    options: 
      - name: ndots
        value: "2"

