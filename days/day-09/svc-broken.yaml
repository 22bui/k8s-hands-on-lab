# 第 9 题 · Service 链路排障：client 一直连不上 api，共 3 处毛病 ≡ω≡
# 规则：client 的 Deployment 一个字都不准改，只能动 api 那边（Deployment/Service）
# kubectl apply -f svc-broken.yaml   （namespace 9-day 要先建好）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: 9-day
  annotations:
    kubernetes.io/change-cause: "Add named http port for Service"
spec:
  replicas: 2
  selector:
    matchLabels: {app: api, tier: backend}
  template:
    metadata:
      labels: {app: api, tier: backend}
    spec:
      containers:
      - name: nginx
        image: docker.io/library/nginx:1.27
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        resources:
          requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: 9-day
spec:
  selector:
    app: api
    tier: backend
  ports:
  - port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: 9-day
spec:
  replicas: 1
  selector:
    matchLabels: {app: client}
  template:
    metadata:
      labels: {app: client}
    spec:
      containers:
      - name: curl
        image: docker.io/library/busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "while true; do if wget -qO- -T 2 http://api:8080 >/dev/null 2>&1; then echo \"$(date +%T) OK\"; else echo \"$(date +%T) FAIL\"; fi; sleep 3; done"]
        resources:
          requests: {cpu: 10m, memory: 8Mi}
