# 第 8 题 · 排障区：4 个 Deployment 各有 1 处毛病，先别看答案直接 apply ≡ω≡
# kubectl apply -f broken.yaml   （namespace 8-day 要先建好）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-a
  namespace: 8-day
spec:
  replicas: 1
  selector:
    matchLabels: {app: web-a}
  template:
    metadata:
      labels: {app: web-a}
    spec:
      containers:
      - name: nginx
        image: docker.io/library/nginx:1.27-alpinee
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-conf
  namespace: 8-day
data:
  application.conf: |
    mode=prod
    workers=2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-b
  namespace: 8-day
spec:
  replicas: 1
  selector:
    matchLabels: {app: web-b}
  template:
    metadata:
      labels: {app: web-b}
    spec:
      containers:
      - name: app
        image: docker.io/library/busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "echo booting...; cat /etc/app/app.conf && sleep 3600"]
        volumeMounts:
        - name: conf
          mountPath: /etc/app
      volumes:
      - name: conf
        configMap:
          name: app-conf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-c
  namespace: 8-day
spec:
  replicas: 1
  selector:
    matchLabels: {app: web-c}
  template:
    metadata:
      labels: {app: web-c}
    spec:
      containers:
      - name: nginx
        image: docker.io/library/nginx:1.27
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "3"
            memory: 64Mi
          limits:
            cpu: "3"
            memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-d
  namespace: 8-day
spec:
  replicas: 1
  selector:
    matchLabels: {app: web-d}
  template:
    metadata:
      labels: {app: web-d}
    spec:
      containers:
      - name: nginx
        image: docker.io/library/nginx:1.27
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-d
  namespace: 8-day
spec:
  selector:
    app: web-d
  ports:
  - port: 80
    targetPort: 80
