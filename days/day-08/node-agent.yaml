apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: 8-day
  annotations:
    note: "first create daemonset"
spec:
  selector:
    matchLabels:
      apps: daemon
  template:
    metadata:
      labels:
        apps: daemon
    spec:
      containers:
        - name: node-agent
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date) $NODE_NAME" >> /var/log/hark-agent/agent.log
                sleep 30
              done
          volumeMounts:
            - name: log-vol
              mountPath: /var/log/hark-agent
      volumes:
        - name: log-vol
          hostPath: 
            path: /var/log/hark-agent
            type: DirectoryOrCreate
      tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule   
