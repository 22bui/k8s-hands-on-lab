apiVersion: batch/v1
kind: Job
metadata:
  name: batch
  namespace: 8-day
spec:
  completions: 6
  parallelism: 2
  template:
    metadata: 
      labels:
        app: batch
    spec:
      containers:
        - name: batch
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - "echo 'batch task running' && sleep 5"
      restartPolicy: Never

